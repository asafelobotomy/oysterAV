# oysterAV's "Security" page in uQ Settings: status, scans, the quarantine, the schedule,
# real-time protection, every preference and the system's state. Installed to
# /usr/share/uq/settings/pages/oysterav-security/ by the oysterav package. Reference:
# docs/settings-pages.md in the uQ repository.
#
# Every command is oyst-cli as the user. What needs root (the rootkit check, turning a
# service on or off) goes through oysterAV's own polkit helper; uQ never runs anything as
# root. Each command that changes or reads a lot has a `--dry-run --json` twin (`preview-*`)
# that prints one plan document, so the confirmation sheet shows what would happen first.
# uq_api 3: streamed scan progress (`output = "ndjson"`) and previewed confirmations.
uq_api = 3
id = "oysterav-security"
name = "Security"
icon = "preferences-system-privacy"
category = "apps"
qml = "Page.qml"
keywords = ["oysterav", "antivirus", "virus", "malware", "clamav", "scan", "quarantine", "rootkit", "firewall", "signatures", "ufw", "firewalld", "ports"]

[[setting]]
id = "setup"
label = "First-time setup"
keywords = ["first run", "wizard", "get started", "install scanners", "hardening", "firewall"]

[[setting]]
id = "status"
label = "Security status"
keywords = ["threat", "signatures", "definitions", "protected"]

[[setting]]
id = "scan"
label = "Scan a folder"
keywords = ["virus scan", "check folder", "profile"]

[[setting]]
id = "rootkit"
label = "Check for rootkits"
keywords = ["integrity", "rkhunter", "chkrootkit", "password"]

[[setting]]
id = "history"
label = "Recent scans"
keywords = ["past scans", "results", "log"]

[[setting]]
id = "quarantine"
label = "Quarantined files"
keywords = ["restore", "delete", "infected", "vault"]

[[setting]]
id = "schedule"
label = "Scheduled scans"
keywords = ["timer", "daily", "weekly", "hourly", "run now"]

[[setting]]
id = "protection"
label = "Real-time protection"
keywords = ["on-access", "clamd", "daemon", "monitor", "services", "fail2ban"]

[[setting]]
id = "firewall"
label = "Firewall"
keywords = ["ufw", "firewalld", "block", "open port", "incoming", "outgoing"]

[[setting]]
id = "firewall-rules"
label = "Firewall rules"
keywords = ["allow port", "block port", "open port", "ufw rule", "exceptions", "zone", "service"]

[[setting]]
id = "firewall-defaults"
label = "Default firewall rules"
keywords = ["incoming", "outgoing", "forwarded", "routed", "policy", "deny all"]

[[setting]]
id = "preferences"
label = "Scan preferences"
keywords = ["settings", "limits", "exclude", "backend", "news", "theme"]

[[setting]]
id = "system"
label = "Scanners and helper"
keywords = ["packs", "doctor", "polkit", "helper", "audit"]

[[setting]]
id = "hardening"
label = "System hardening"
keywords = ["apparmor", "selinux", "secure boot", "lockdown", "sysctl", "kernel", "auditd", "usbguard", "mitigations"]

[requires]
bins = ["oyst-cli"]

# ---- Reads: local state, no scans, no passwords -----------------------------------------
[[command]]
id = "summary"
argv = ["/usr/bin/oyst-cli", "status", "summary", "--deep", "--json"]
output = "json"
timeout_ms = 15000

# First-time setup state; it checks which scanners are installed, so it takes a moment.
[[command]]
id = "setup-status"
argv = ["/usr/bin/oyst-cli", "setup", "status", "--json"]
output = "json"
timeout_ms = 60000

[[command]]
id = "job"
argv = ["/usr/bin/oyst-cli", "job", "status", "--json"]
output = "json"
timeout_ms = 5000

[[command]]
id = "history"
argv = ["/usr/bin/oyst-cli", "history", "--limit", "20", "--json"]
output = "json"
timeout_ms = 10000

[[command]]
id = "quarantine-list"
argv = ["/usr/bin/oyst-cli", "quarantine", "list", "--json"]
output = "json"
timeout_ms = 5000

[[command]]
id = "quarantine-verify"
argv = ["/usr/bin/oyst-cli", "quarantine", "verify", "--json"]
output = "json"
timeout_ms = 60000

[[command]]
id = "schedule-status"
argv = ["/usr/bin/oyst-cli", "schedule", "status", "--json"]
output = "json"
timeout_ms = 10000

[[command]]
id = "services"
argv = ["/usr/bin/oyst-cli", "services", "status", "--json"]
output = "json"
timeout_ms = 20000

[[command]]
id = "signatures"
argv = ["/usr/bin/oyst-cli", "freshclam", "status", "--json"]
output = "json"
timeout_ms = 10000

[[command]]
id = "doctor"
argv = ["/usr/bin/oyst-cli", "doctor", "--json"]
output = "json"
timeout_ms = 60000

[[command]]
id = "hardening"
argv = ["/usr/bin/oyst-cli", "status", "hardening", "--json"]
output = "json"
timeout_ms = 10000

[[command]]
id = "helper"
argv = ["/usr/bin/oyst-cli", "helper-status", "--json"]
output = "json"
timeout_ms = 10000

[[command]]
id = "audit"
argv = ["/usr/bin/oyst-cli", "audit", "list", "--limit", "30", "--json"]
output = "json"
timeout_ms = 10000

# Every preference with its value and what it accepts; followed live, so a change made in
# oysterAV or by hand shows here.
[[command]]
id = "config"
argv = ["/usr/bin/oyst-cli", "config", "show", "--json"]
output = "json"
timeout_ms = 10000
watch = { files = ["~/.config/oysterav/config.toml"] }

# ---- Previews: what a change would do, one plan document each (reads, so they don't ask) --
[[command]]
id = "preview-scan"
argv = ["/usr/bin/oyst-cli", "scan", "--dry-run", "--json", "--profile"]
output = "json"
timeout_ms = 20000
args = [{ name = "profile", pattern = '^(quick|full)$' }, { name = "folder", pattern = '^/[^\x00-\x1f\x7f]*$' }]

[[command]]
id = "preview-rootkit"
argv = ["/usr/bin/oyst-cli", "scan", "--profile", "integrity", "--dry-run", "--json"]
output = "json"
timeout_ms = 20000

[[command]]
id = "preview-restore"
argv = ["/usr/bin/oyst-cli", "quarantine", "restore", "--dry-run", "--json"]
output = "json"
timeout_ms = 10000
args = [{ name = "entry", pattern = '^[1-9][0-9]{0,8}$' }]

[[command]]
id = "preview-delete"
argv = ["/usr/bin/oyst-cli", "quarantine", "delete", "--dry-run", "--json"]
output = "json"
timeout_ms = 10000
args = [{ name = "entry", pattern = '^[1-9][0-9]{0,8}$' }]

[[command]]
id = "preview-reconcile"
argv = ["/usr/bin/oyst-cli", "quarantine", "reconcile", "--delete-orphans", "--dry-run", "--json"]
output = "json"
timeout_ms = 30000

[[command]]
id = "preview-quarantine-add"
argv = ["/usr/bin/oyst-cli", "quarantine", "add", "--dry-run", "--json", "--threat"]
output = "json"
timeout_ms = 10000
args = [{ name = "threat", pattern = '^[A-Za-z0-9][A-Za-z0-9._:/+() -]{0,199}$' }, { name = "path", pattern = '^/[^\x00-\x1f\x7f]*$' }]

[[command]]
id = "preview-harden"
argv = ["/usr/bin/oyst-cli", "hardening", "set", "--dry-run", "--json"]
output = "json"
timeout_ms = 20000
args = [{ name = "harden", pattern = '^(apply|revert)$' }]

[[command]]
id = "preview-service"
argv = ["/usr/bin/oyst-cli", "services", "set", "--dry-run", "--json"]
output = "json"
timeout_ms = 20000
args = [{ name = "service", pattern = '^(clamd|clamonacc|freshclam-timer|fail2ban|maldet-monitor|schedule-linger)$' }, { name = "state", pattern = '^(on|off)$' }]

# ---- First-time setup ---------------------------------------------------------------------------
# The same guided setup oysterAV's window runs (`oyst-cli setup run`): scanners, the daily scan timer,
# runtime bootstrap, and, in the recommended form, host hardening and the firewall. What needs root goes
# through oysterAV's polkit helper. The basic form leaves hardening and the firewall alone.
[[command]]
id = "preview-setup"
argv = ["/usr/bin/oyst-cli", "setup", "run", "--dry-run", "--json"]
output = "json"
timeout_ms = 30000

[[command]]
id = "preview-setup-basic"
argv = ["/usr/bin/oyst-cli", "setup", "run", "--skip-harden", "--no-enable-firewall", "--dry-run", "--json"]
output = "json"
timeout_ms = 30000

[[command]]
id = "setup-run"
argv = ["/usr/bin/oyst-cli", "setup", "run", "--confirm", "--json"]
output = "json"
timeout_ms = 600000
confirm = "Run the first-time setup? It installs the scanners, applies host hardening and turns the firewall on, and asks for your password."
preview = "preview-setup"

[[command]]
id = "setup-run-basic"
argv = ["/usr/bin/oyst-cli", "setup", "run", "--skip-harden", "--no-enable-firewall", "--confirm", "--json"]
output = "json"
timeout_ms = 600000
confirm = "Run the basic first-time setup? It installs the scanners and the scan timer, and asks for your password. Hardening and the firewall stay as they are."
preview = "preview-setup-basic"

# ---- Scans ----------------------------------------------------------------------------------
# Quick (ClamAV) or full (ClamAV and maldet) on one folder, as you; quarantines nothing.
# One JSON object per line: {event: progress, stage, percent}, then {event: result, ...}.
# Exit 0 clean, 1 threats found, 2 error, 3 another scan is running, 5 a scanner is missing.
# Settings kills a command after 10 minutes; scan very large trees from oysterAV itself.
[[command]]
id = "scan-folder"
argv = ["/usr/bin/oyst-cli", "scan", "--ndjson", "--profile"]
output = "ndjson"
timeout_ms = 600000
args = [{ name = "profile", pattern = '^(quick|full)$' }, { name = "folder", pattern = '^/[^\x00-\x1f\x7f]*$' }]

# Rootkit scanners need root: oyst-cli asks once through its polkit helper.
[[command]]
id = "rootkit-check"
argv = ["/usr/bin/oyst-cli", "scan", "--profile", "integrity", "--confirm", "--ndjson"]
output = "ndjson"
timeout_ms = 600000
confirm = "Check this computer for rootkits? oysterAV asks for your password once, through its own helper."
preview = "preview-rootkit"

[[command]]
id = "scan-cancel"
argv = ["/usr/bin/oyst-cli", "job", "cancel", "--json"]
output = "json"
timeout_ms = 10000

[[command]]
id = "update-signatures"
argv = ["/usr/bin/oyst-cli", "freshclam", "update", "--json"]
output = "json"
timeout_ms = 600000

# ---- Quarantine -------------------------------------------------------------------------------
[[command]]
id = "quarantine-add"
argv = ["/usr/bin/oyst-cli", "quarantine", "add", "--confirm", "--json", "--threat"]
output = "json"
timeout_ms = 30000
args = [{ name = "threat", pattern = '^[A-Za-z0-9][A-Za-z0-9._:/+() -]{0,199}$' }, { name = "path", pattern = '^/[^\x00-\x1f\x7f]*$' }]
confirm = "Move this file to the quarantine vault? It was flagged as %s."
preview = "preview-quarantine-add"

[[command]]
id = "quarantine-restore"
argv = ["/usr/bin/oyst-cli", "quarantine", "restore", "--confirm", "--json"]
output = "json"
timeout_ms = 30000
args = [{ name = "entry", pattern = '^[1-9][0-9]{0,8}$' }]
confirm = "Restore quarantined file #%s to where it was found? It may be harmful."
preview = "preview-restore"

[[command]]
id = "quarantine-delete"
argv = ["/usr/bin/oyst-cli", "quarantine", "delete", "--confirm", "--json"]
output = "json"
timeout_ms = 30000
args = [{ name = "entry", pattern = '^[1-9][0-9]{0,8}$' }]
confirm = "Delete quarantined file #%s for good? This can't be undone."
preview = "preview-delete"

[[command]]
id = "quarantine-reconcile"
argv = ["/usr/bin/oyst-cli", "quarantine", "reconcile", "--delete-orphans", "--confirm", "--json"]
output = "json"
timeout_ms = 60000
confirm = "Delete the stray files in the quarantine vault? They belong to no entry."
preview = "preview-reconcile"

# ---- Schedule -----------------------------------------------------------------------------------
[[command]]
id = "schedule-enable"
argv = ["/usr/bin/oyst-cli", "schedule", "enable", "--json"]
output = "json"
timeout_ms = 30000

[[command]]
id = "schedule-disable"
argv = ["/usr/bin/oyst-cli", "schedule", "disable", "--confirm", "--json"]
output = "json"
timeout_ms = 30000
confirm = "Turn off scheduled scans?"

[[command]]
id = "schedule-frequency"
argv = ["/usr/bin/oyst-cli", "schedule", "set", "--apply", "--json", "--frequency"]
output = "json"
timeout_ms = 30000
args = [{ name = "frequency", pattern = '^(hourly|daily|weekly)$' }]

[[command]]
id = "schedule-time"
argv = ["/usr/bin/oyst-cli", "schedule", "set", "--apply", "--json", "--time"]
output = "json"
timeout_ms = 30000
args = [{ name = "time", pattern = '^([01][0-9]|2[0-3]):[0-5][0-9]$' }]

[[command]]
id = "schedule-weekday"
argv = ["/usr/bin/oyst-cli", "schedule", "set", "--apply", "--json", "--weekday"]
output = "json"
timeout_ms = 30000
args = [{ name = "weekday", pattern = '^(mon|tue|wed|thu|fri|sat|sun)$' }]

[[command]]
id = "schedule-profile"
argv = ["/usr/bin/oyst-cli", "schedule", "set", "--apply", "--json", "--profile"]
output = "json"
timeout_ms = 30000
args = [{ name = "scheduled_profile", pattern = '^(quick|full|integrity|suite)$' }]

[[command]]
id = "schedule-quarantine"
argv = ["/usr/bin/oyst-cli", "schedule", "set", "--apply", "--json", "--quarantine"]
output = "json"
timeout_ms = 30000
args = [{ name = "quarantine", pattern = '^(auto|on|off)$' }]

# Starts one scan with the schedule's settings, now. Settings stops it after 10 minutes.
[[command]]
id = "schedule-run"
argv = ["/usr/bin/oyst-cli", "schedule", "run", "--json"]
output = "json"
timeout_ms = 600000
confirm = "Run the scheduled scan now? It uses the profile and folders you set for the schedule."

# ---- Real-time protection and preferences ------------------------------------------------------
# Turning a service on or off asks for your password through oysterAV's helper.
[[command]]
id = "service-set"
argv = ["/usr/bin/oyst-cli", "services", "set", "--confirm", "--json"]
output = "json"
timeout_ms = 120000
args = [{ name = "service", pattern = '^(clamd|clamonacc|freshclam-timer|fail2ban|maldet-monitor|schedule-linger)$' }, { name = "state", pattern = '^(on|off)$' }]
confirm = "Change the %s service? oysterAV may ask for your password."
preview = "preview-service"

# The System tab's Harden button: oysterAV's one sysctl file (/etc/sysctl.d/90-oysterav-hardening.conf),
# written or removed by its polkit helper. The helper picks the keys and values; never looser than now.
[[command]]
id = "harden-set"
argv = ["/usr/bin/oyst-cli", "hardening", "set", "--confirm", "--json"]
output = "json"
timeout_ms = 120000
args = [{ name = "harden", pattern = '^(apply|revert)$' }]
confirm = "Change the kernel's security settings? oysterAV will ask for your password."
preview = "preview-harden"

# `config set` checks every value before it writes and refuses what it wouldn't load.
[[command]]
id = "config-set"
argv = ["/usr/bin/oyst-cli", "config", "set", "--json"]
output = "json"
timeout_ms = 30000
args = [{ name = "key", pattern = '^(scan|clamav|quarantine|clamonacc|maldet_monitor|runtime|fangfrisch|rkhunter|lynis|ui)\.[a-z_]{1,40}$' }, { name = "value", pattern = '^[^\x00-\x1f\x7f]{0,600}$' }]

# ---- Firewall ----------------------------------------------------------------------------------------
# UFW (what Bindle sets up) or firewalld, through oysterAV's own polkit helper: one password prompt per
# change, and a plan first. The read needs no password and follows UFW's files. Every value is positional
# (`oyst-cli firewall rule add ACTION PORT PROTO SOURCE`); SOURCE is "anywhere" or an address or network.
[[command]]
id = "firewall"
argv = ["/usr/bin/oyst-cli", "firewall", "overview", "--json"]
output = "json"
timeout_ms = 30000
watch = { files = ["/etc/ufw/user.rules", "/etc/ufw/user6.rules", "/etc/ufw/ufw.conf", "/etc/default/ufw"] }

[[command]]
id = "preview-fw-turn"
argv = ["/usr/bin/oyst-cli", "firewall", "turn", "--dry-run", "--json"]
output = "json"
timeout_ms = 30000
args = [{ name = "state", pattern = '^(on|off)$' }]

[[command]]
id = "fw-turn"
argv = ["/usr/bin/oyst-cli", "firewall", "turn", "--confirm", "--json"]
output = "json"
timeout_ms = 120000
args = [{ name = "state", pattern = '^(on|off)$' }]
confirm = "Turn the firewall %s?"
preview = "preview-fw-turn"

[[command]]
id = "preview-fw-use"
argv = ["/usr/bin/oyst-cli", "firewall", "use", "--dry-run", "--json"]
output = "json"
timeout_ms = 30000
args = [{ name = "backend", pattern = '^(ufw|firewalld)$' }]

[[command]]
id = "fw-use"
argv = ["/usr/bin/oyst-cli", "firewall", "use", "--confirm", "--json"]
output = "json"
timeout_ms = 300000
args = [{ name = "backend", pattern = '^(ufw|firewalld)$' }]
confirm = "Use %s as the firewall?"
preview = "preview-fw-use"

[[command]]
id = "preview-fw-policy"
argv = ["/usr/bin/oyst-cli", "firewall", "policy", "--dry-run", "--json"]
output = "json"
timeout_ms = 30000
args = [{ name = "direction", pattern = '^(incoming|outgoing|routed)$' }, { name = "policy", pattern = '^(allow|deny|reject)$' }]

[[command]]
id = "fw-policy"
argv = ["/usr/bin/oyst-cli", "firewall", "policy", "--confirm", "--json"]
output = "json"
timeout_ms = 120000
args = [{ name = "direction", pattern = '^(incoming|outgoing|routed)$' }, { name = "policy", pattern = '^(allow|deny|reject)$' }]
confirm = "Change what happens to %s connections?"
preview = "preview-fw-policy"

[[command]]
id = "preview-fw-rule-add"
argv = ["/usr/bin/oyst-cli", "firewall", "rule", "add", "--dry-run", "--json"]
output = "json"
timeout_ms = 30000
args = [{ name = "action", pattern = '^(allow|deny|limit)$' }, { name = "port", pattern = '^[0-9]{1,5}(:[0-9]{1,5})?$' }, { name = "proto", pattern = '^(tcp|udp)$' }, { name = "source", pattern = '^(anywhere|[0-9A-Fa-f.:]{2,39}(/[0-9]{1,3})?)$' }]

[[command]]
id = "fw-rule-add"
argv = ["/usr/bin/oyst-cli", "firewall", "rule", "add", "--confirm", "--json"]
output = "json"
timeout_ms = 120000
args = [{ name = "action", pattern = '^(allow|deny|limit)$' }, { name = "port", pattern = '^[0-9]{1,5}(:[0-9]{1,5})?$' }, { name = "proto", pattern = '^(tcp|udp)$' }, { name = "source", pattern = '^(anywhere|[0-9A-Fa-f.:]{2,39}(/[0-9]{1,3})?)$' }]
confirm = "Add this firewall rule?"
preview = "preview-fw-rule-add"

[[command]]
id = "preview-fw-rule-remove"
argv = ["/usr/bin/oyst-cli", "firewall", "rule", "remove", "--dry-run", "--json"]
output = "json"
timeout_ms = 30000
args = [{ name = "action", pattern = '^(allow|deny|limit)$' }, { name = "port", pattern = '^[0-9]{1,5}(:[0-9]{1,5})?$' }, { name = "proto", pattern = '^(tcp|udp)$' }, { name = "source", pattern = '^(anywhere|[0-9A-Fa-f.:]{2,39}(/[0-9]{1,3})?)$' }]

[[command]]
id = "fw-rule-remove"
argv = ["/usr/bin/oyst-cli", "firewall", "rule", "remove", "--confirm", "--json"]
output = "json"
timeout_ms = 120000
args = [{ name = "action", pattern = '^(allow|deny|limit)$' }, { name = "port", pattern = '^[0-9]{1,5}(:[0-9]{1,5})?$' }, { name = "proto", pattern = '^(tcp|udp)$' }, { name = "source", pattern = '^(anywhere|[0-9A-Fa-f.:]{2,39}(/[0-9]{1,3})?)$' }]
confirm = "Remove this firewall rule?"
preview = "preview-fw-rule-remove"

[[command]]
id = "preview-fw-rule-change"
argv = ["/usr/bin/oyst-cli", "firewall", "rule", "change", "--dry-run", "--json"]
output = "json"
timeout_ms = 30000
args = [{ name = "action", pattern = '^(allow|deny|limit)$' }, { name = "port", pattern = '^[0-9]{1,5}(:[0-9]{1,5})?$' }, { name = "proto", pattern = '^(tcp|udp)$' }, { name = "source", pattern = '^(anywhere|[0-9A-Fa-f.:]{2,39}(/[0-9]{1,3})?)$' }, { name = "new_action", pattern = '^(allow|deny|limit)$' }, { name = "new_port", pattern = '^[0-9]{1,5}(:[0-9]{1,5})?$' }, { name = "new_proto", pattern = '^(tcp|udp)$' }, { name = "new_source", pattern = '^(anywhere|[0-9A-Fa-f.:]{2,39}(/[0-9]{1,3})?)$' }]

[[command]]
id = "fw-rule-change"
argv = ["/usr/bin/oyst-cli", "firewall", "rule", "change", "--confirm", "--json"]
output = "json"
timeout_ms = 120000
args = [{ name = "action", pattern = '^(allow|deny|limit)$' }, { name = "port", pattern = '^[0-9]{1,5}(:[0-9]{1,5})?$' }, { name = "proto", pattern = '^(tcp|udp)$' }, { name = "source", pattern = '^(anywhere|[0-9A-Fa-f.:]{2,39}(/[0-9]{1,3})?)$' }, { name = "new_action", pattern = '^(allow|deny|limit)$' }, { name = "new_port", pattern = '^[0-9]{1,5}(:[0-9]{1,5})?$' }, { name = "new_proto", pattern = '^(tcp|udp)$' }, { name = "new_source", pattern = '^(anywhere|[0-9A-Fa-f.:]{2,39}(/[0-9]{1,3})?)$' }]
confirm = "Change this firewall rule?"
preview = "preview-fw-rule-change"

[[command]]
id = "preview-fw-zone-port"
argv = ["/usr/bin/oyst-cli", "firewall", "zone", "port", "--dry-run", "--json"]
output = "json"
timeout_ms = 30000
args = [{ name = "op", pattern = '^(add|remove)$' }, { name = "zone", pattern = '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$' }, { name = "port_spec", pattern = '^[0-9]{1,5}/(tcp|udp)$' }]

[[command]]
id = "fw-zone-port"
argv = ["/usr/bin/oyst-cli", "firewall", "zone", "port", "--confirm", "--json"]
output = "json"
timeout_ms = 120000
args = [{ name = "op", pattern = '^(add|remove)$' }, { name = "zone", pattern = '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$' }, { name = "port_spec", pattern = '^[0-9]{1,5}/(tcp|udp)$' }]
confirm = "Change which ports are open in this zone?"
preview = "preview-fw-zone-port"

[[command]]
id = "preview-fw-zone-service"
argv = ["/usr/bin/oyst-cli", "firewall", "zone", "service", "--dry-run", "--json"]
output = "json"
timeout_ms = 30000
args = [{ name = "op", pattern = '^(add|remove)$' }, { name = "zone", pattern = '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$' }, { name = "fw_service", pattern = '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$' }]

[[command]]
id = "fw-zone-service"
argv = ["/usr/bin/oyst-cli", "firewall", "zone", "service", "--confirm", "--json"]
output = "json"
timeout_ms = 120000
args = [{ name = "op", pattern = '^(add|remove)$' }, { name = "zone", pattern = '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$' }, { name = "fw_service", pattern = '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$' }]
confirm = "Change which services are open in this zone?"
preview = "preview-fw-zone-service"
