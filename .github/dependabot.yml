# Dependabot — keep Actions and Python deps visible for Scorecard / supply-chain hygiene.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # uv ecosystem updates pyproject.toml and uv.lock together (the pip ecosystem
  # only touched pyproject.toml, leaving the lockfile the gates audit stale).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
