# Secret scan + Semgrep SAST (blocking). See docs/security/test-gates.md.
name: Security scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      # Pinned tag + index digest (Docker Hub, 2026-10-11). Dependabot (docker) does not
      # track job containers; bump manually.
      image: semgrep/semgrep:1.180.0@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep scan (python + security-audit)
        run: |
          semgrep scan \
            --config p/python \
            --config p/security-audit \
            --exclude-rule python.lang.security.audit.insecure-file-permissions.insecure-file-permissions \
            --exclude-rule python.lang.security.audit.dynamic-urllib-use-detected.dynamic-urllib-use-detected \
            --error \
            --metrics=off \
            oyst_core oyst_cli
