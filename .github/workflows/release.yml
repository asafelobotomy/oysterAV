name: Release

on:
  push:
    branches: [main, master]
    paths:
      - VERSION
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (empty = VERSION file)"
        required: false
        type: string
        default: ""
      force:
        description: "Rebuild and (re)publish even if the tag already exists"
        required: false
        type: boolean
        default: false

# Least privilege: jobs that push tags / commits or publish the release opt in
# to contents: write individually.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.detect.outputs.should_release }}
      version: ${{ steps.detect.outputs.version }}
      tag: ${{ steps.detect.outputs.tag }}
      force: ${{ steps.detect.outputs.force }}
      build_ref: ${{ steps.detect.outputs.build_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        name: Detect release candidate
        # Dispatcher-controlled inputs go through env, never expression-interpolated into run.
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          FORCE="false"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${INPUT_FORCE:-}" == "true" ]]; then
            FORCE="true"
          fi
          if [[ "$FORCE" == "true" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::force republish is only allowed from refs/heads/main (got ${GITHUB_REF})"
            exit 1
          fi
          echo "force=${FORCE}" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "${INPUT_VERSION:-}" ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$(tr -d '[:space:]' < VERSION)"
          fi
          if [[ ! "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::invalid release version (expected X.Y.Z or vX.Y.Z)"
            exit 1
          fi
          VERSION="${VERSION#v}"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          # Force republish builds from the workflow commit (packaging fixes) while
          # still attaching assets to the existing tag. Normal cuts build the tag tip.
          if [[ "$FORCE" == "true" ]]; then
            echo "build_ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "Force republish requested for ${TAG} from ${GITHUB_SHA}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "build_ref=${TAG}" >> "$GITHUB_OUTPUT"

          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists — skipping release (use workflow_dispatch force=true to republish)."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Manual dispatch for new tag ${TAG}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse HEAD^ >/dev/null 2>&1; then
            if git diff --quiet HEAD^ HEAD -- VERSION; then
              echo "VERSION unchanged vs parent — skipping."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            echo "No parent commit; treating as first release candidate."
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "Will release ${TAG}"

  prepare:
    needs: detect
    if: needs.detect.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Token is only exposed to the push step (not to uv/PyPI code).
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Verify VERSION is synced
        env:
          EXPECTED: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "$FILE_VERSION" != "$EXPECTED" ]]; then
            echo "VERSION file (${FILE_VERSION}) does not match release version (${EXPECTED})" >&2
            exit 1
          fi
          uv run python scripts/sync_version.py --check
      - name: Create and push tag if missing
        env:
          TAG: ${{ needs.detect.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${AUTH#AUTHORIZATION: basic }"
          git -c "http.https://github.com/.extraheader=${AUTH}" fetch --tags origin
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists — leaving in place."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git -c "http.https://github.com/.extraheader=${AUTH}" push origin "$TAG"

  python-dist:
    needs: [detect, prepare]
    if: needs.detect.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.detect.outputs.build_ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install GUI native build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            python3-dev \
            libcairo2-dev \
            libgirepository-2.0-dev \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1
      - run: uv sync --extra all
      - run: uv run python scripts/sync_version.py --check
      - run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz

  runtime:
    needs: [detect, prepare]
    if: needs.detect.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.detect.outputs.build_ref }}
          persist-credentials: false
      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd curl
      - run: bash scripts/build_runtime.sh x86_64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-x86_64
          path: dist/runtime-x86_64.tar.zst

  flatpak:
    needs: [detect, prepare]
    if: needs.detect.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.detect.outputs.build_ref }}
          persist-credentials: false
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
      - name: Build Flatpak bundle
        run: bash scripts/build_flatpak.sh x86_64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak
          path: dist/*.flatpak

  native-pkgs:
    needs: [detect, prepare]
    if: needs.detect.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.detect.outputs.build_ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install fpm dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm \
            pkg-config python3-dev libcairo2-dev libgirepository-2.0-dev \
            gir1.2-gtk-4.0 gir1.2-adw-1
          sudo gem install --no-document fpm -v 1.17.0
      - name: Build DEB and RPM
        run: |
          uv sync --extra all
          export PYTHON_BIN="$(uv run which python)"
          bash scripts/build_native_packages.sh x86_64
      - name: Smoke-check native packages
        run: |
          set -euo pipefail
          DEB="$(ls dist/*.deb | head -n1)"
          RPM="$(ls dist/*.rpm | head -n1)"
          dpkg-deb -I "$DEB"
          rpm -qp --info "$RPM"
          DEB_DEPS="$(dpkg-deb -f "$DEB" Depends)"
          RPM_REQS="$(rpm -qpR "$RPM")"
          for dep in python3-click python3-pydantic python3-defusedxml; do
            echo "$DEB_DEPS" | grep -F "$dep"
            echo "$RPM_REQS" | grep -F "$dep"
          done
      - name: Install-test native packages in distro containers
        run: bash scripts/smoke_native_packages.sh dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-pkgs
          path: |
            dist/*.deb
            dist/*.rpm

  arch:
    needs: [detect, prepare]
    if: needs.detect.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.detect.outputs.build_ref }}
          persist-credentials: false
      - name: Render PKGBUILD with release checksum
        run: |
          set -euo pipefail
          # Tag is created in prepare; require a real sha256 of the GitHub archive.
          export REQUIRE_SHA256=1
          bash scripts/render_arch_pkgbuild.sh
          if grep -q "sha256sums=('SKIP')" dist/PKGBUILD; then
            echo "ERROR: sha256sums still SKIP" >&2
            exit 1
          fi
          grep -E "python-defusedxml|sha256sums" dist/PKGBUILD dist/.SRCINFO
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arch-pkgbuild
          include-hidden-files: true
          path: |
            dist/PKGBUILD
            dist/.SRCINFO

  release:
    needs: [detect, prepare, python-dist, runtime, flatpak, native-pkgs, arch]
    if: needs.detect.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    # Create the `release` environment with required reviewers in repo settings.
    environment: release
    permissions:
      contents: write # publish release assets + push CHANGELOG.md to main
      id-token: write # OIDC for Sigstore build-provenance attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.detect.outputs.build_ref }}
          persist-credentials: false
      - name: Generate release notes (latest section)
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG_RELEASE.md
      - name: Generate full CHANGELOG.md
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
        env:
          OUTPUT: CHANGELOG_FULL.md
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true
      - name: List assets
        run: find release-assets -type f | sort
      - name: Stage assets for upload
        run: |
          set -euo pipefail
          mkdir -p staged
          find release-assets -type f -exec cp -t staged {} +
          # GitHub Release asset names cannot be leading-dot; publish as SRCINFO.
          if [[ -f staged/.SRCINFO ]]; then
            mv staged/.SRCINFO staged/SRCINFO
          elif [[ ! -f staged/SRCINFO ]]; then
            echo "ERROR: .SRCINFO/SRCINFO missing from arch artifact" >&2
            find release-assets -type f | sort >&2
            exit 1
          fi
          (cd staged && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          ls -la staged
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: staged/*
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.detect.outputs.tag }}
          name: oysterAV ${{ needs.detect.outputs.version }}
          body_path: CHANGELOG_RELEASE.md
          files: staged/*
          fail_on_unmatched_files: true
          generate_release_notes: false
          make_latest: true
          draft: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit full CHANGELOG.md to main
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${AUTH#AUTHORIZATION: basic }"
          cp CHANGELOG_FULL.md "$RUNNER_TEMP/CHANGELOG.md"
          git -c "http.https://github.com/.extraheader=${AUTH}" fetch origin main
          git checkout -B main origin/main
          cp "$RUNNER_TEMP/CHANGELOG.md" CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "CHANGELOG.md already up to date."
            exit 0
          fi
          git commit -m "docs(changelog): v${VERSION}"
          git -c "http.https://github.com/.extraheader=${AUTH}" push origin main

  # Releases created with GITHUB_TOKEN do not fire `release: published`, so
  # dispatch publish-pypi.yml explicitly (workflow_dispatch is exempt from that
  # rule). Publishing stays in publish-pypi.yml so the PyPI Trusted Publisher
  # (workflow publish-pypi.yml, environment pypi) keeps matching; pypa's action
  # does not support trusted publishing from inside a reusable workflow.
  pypi:
    needs: [detect, release]
    if: needs.detect.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write # gh workflow run
    steps:
      - name: Dispatch publish-pypi.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run publish-pypi.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f tag="$TAG"
