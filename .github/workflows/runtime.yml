name: Runtime bundle

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_runtime.sh"
      - "oyst_core/runtime/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd curl
      - name: Build runtime tarball
        run: bash scripts/build_runtime.sh x86_64
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-x86_64
          path: dist/runtime-x86_64.tar.zst
