# Optional hostile-client simulation (not PR-blocking).
# See docs/security/attacker-sim.md
name: Security attacker-sim

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC

permissions:
  contents: read

jobs:
  attacker-sim:
    name: Attacker sim dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Sync deps
        run: uv sync --extra dev
      - name: Run attacker_sim dry-run
        run: ./scripts/attacker_sim.sh --dry-run
