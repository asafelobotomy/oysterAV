name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      # PyGObject → pycairo needs cairo headers (uv sync --extra all / gui).
      - name: Install GUI native build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            python3-dev \
            libcairo2-dev \
            libgirepository-2.0-dev \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1
      - run: uv sync --extra all
      - name: Version files must match VERSION
        run: uv run python scripts/sync_version.py --check
      - name: Production files must stay within 400-line hard limit
        run: uv run python scripts/check_loc.py
      - name: uQ's kits (uq/native.toml) are the pinned releases
        run: scripts/check-uq-native.sh
      - name: Every source file is within 400 lines of code (uQ's uq-loc)
        run: scripts/check-loc.sh
      - run: uv run ruff format --check oyst_core oyst_cli oysterav tests
      - run: uv run ruff check oyst_core oyst_cli oysterav tests
      - run: uv run mypy oyst_core oyst_cli oysterav
      # Coverage sources + fail_under: pyproject.toml. Do not add --cov=oysterav.
      - run: uv run pytest tests/ --cov=oyst_core --cov=oyst_cli --cov-report=term-missing
      - name: Security property suite
        run: uv run pytest -m security -q --no-cov
      - name: Security module coverage (≥85%)
        run: uv run python scripts/check_security_coverage.py
      # Tool pins: keep in sync with scripts/check.sh. Python 3.12 is required to
      # parse PEP 695 syntax; bandit silently skips unparseable files, so fail on skips.
      - name: Bandit (medium+ severity/confidence)
        run: |
          set -euo pipefail
          uv tool run --python 3.12 bandit==1.9.4 -c bandit.yaml -r oyst_core oyst_cli -ll -ii \
            | tee "$RUNNER_TEMP/bandit.txt"
          grep -q '^Files skipped (0):' "$RUNNER_TEMP/bandit.txt" || {
            echo "::error::bandit skipped files (see 'Files skipped' above)"; exit 1; }
      - name: pip-audit (project lockfile)
        run: |
          set -euo pipefail
          uv export --frozen --all-extras --no-emit-project --quiet -o "$RUNNER_TEMP/requirements.txt"
          uv tool run pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" \
            --require-hashes --disable-pip --progress-spinner off
      - name: GUI must not call security binaries directly
        run: |
          ! rg -n "subprocess\.(run|call|Popen)|os\.system\(|\bpkexec\b|\bsystemctl\b.*\bclam" oysterav/ || \
            (echo "GUI must use OystClient only" && exit 1)

  # oysterAV's Security page in uQ Settings (uq/pages/oysterav-security/): its Node and QML tests, and
  # uqctl's own check of the uq/ folder.
  uq:
    name: uQ Settings page
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The uQ release whose `uqctl` checks the page (uq_api 3 is in every release since v0.3.0).
      UQ_TAG: v0.3.37
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Qt Quick and qmltestrunner
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools \
            qml6-module-qtquick qml6-module-qtquick-layouts qml6-module-qtquick-controls \
            qml6-module-qttest qml6-module-qtqml qml6-module-qtqml-workerscript \
            qml6-module-qtquick-window qml6-module-qtquick-templates qml6-module-qtquick-dialogs
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Page logic and manifest tests (Node)
        run: node --test 'tests/uq/*.test.mjs'
      # QML_XHR_ALLOW_FILE_READ lets the page tests read tests/uq/fixtures/.
      - name: Page tests (QML, offscreen)
        run: QML_XHR_ALLOW_FILE_READ=1 QT_QPA_PLATFORM=offscreen /usr/lib/qt6/bin/qmltestrunner -import tests/uq/stub -input tests/uq
      - name: Cache uqctl
        id: uqctl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.uq
          key: uqctl-${{ env.UQ_TAG }}
      - name: Build uqctl
        if: steps.uqctl.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/asafelobotomy/uq --tag "$UQ_TAG" uqctl --root "$HOME/.uq"
      # `--no-programs` skips only the "program exists" check: oysterAV isn't installed here.
      - name: uQ integration check
        run: ~/.uq/bin/uqctl integrations check --no-programs uq/
