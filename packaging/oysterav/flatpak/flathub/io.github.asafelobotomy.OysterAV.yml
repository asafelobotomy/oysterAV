# Flathub-oriented Flatpak manifest (offline PyPI wheels + GitHub tag archive).
# GitHub Release CI continues to use ../io.github.asafelobotomy.OysterAV.yml (dir source).
app-id: io.github.asafelobotomy.OysterAV
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: oysterav

finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  # NOT a sandbox: host filesystem + flatpak-spawn --host (arbitrary host commands)
  # are required to drive host scanners and Polkit. Disclosed in the metainfo.
  - --filesystem=host
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: python3-dependencies
    buildsystem: simple
    build-commands:
      - >
        pip3 install --verbose --exists-action=i --no-index
        --find-links="file://${PWD}" --prefix=${FLATPAK_DEST}
        click defusedxml annotated-types typing-extensions typing-inspection
        pydantic-core pydantic packaging pathspec pluggy trove-classifiers hatchling
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/fb/e2/79c688af8b210d232694e31e59da9f6ec747bae31c3f5946e4e9b98860d5/click-8.4.2-py3-none-any.whl
