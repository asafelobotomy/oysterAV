# Bandit config for oysterAV privilege / CLI surfaces.
# Gate command (medium+ severity/confidence): 
#   uv tool run bandit -c bandit.yaml -r oyst_core oyst_cli -ll -ii
# See docs/security/test-gates.md.

exclude_dirs:
  - tests
  - .venv
  - venv

# Intentional skips (see docs/security/test-gates.md):
# - B404 import subprocess: privilege helpers spawn allowlisted argv lists
# - B603 subprocess without shell: shell=False + argv lists (asserted in tests)
# - B607 partial executable path: resolve_trusted_binary / fixed PATH
skips:
  - B404
  - B603
  - B607
